<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530"><rect width="900" height="530" fill="#f8fafc"/><g font-family="sans-serif" font-size="18" text-anchor="middle"><text x="450" y="30" font-weight="bold">Вызовы методов: от низкого приоритета к высокому</text><rect x="185.0" y="55" width="530" height="46" rx="9" fill="#e0f2fe" stroke="#0284c7"/><text x="450" y="84" fill="#0f172a">parseEquality: ==, !=</text><path d="M450 101 L450 130" stroke="#64748b" stroke-width="2" fill="none"/><rect x="185.0" y="130" width="530" height="46" rx="9" fill="#e0f2fe" stroke="#0284c7"/><text x="450" y="159" fill="#0f172a">parseComparison: &lt;, &lt;=, &gt;, &gt;=</text><path d="M450 176 L450 205" stroke="#64748b" stroke-width="2" fill="none"/><rect x="185.0" y="205" width="530" height="46" rx="9" fill="#e0f2fe" stroke="#0284c7"/><text x="450" y="234" fill="#0f172a">parseAddition: +, −</text><path d="M450 251 L450 280" stroke="#64748b" stroke-width="2" fill="none"/><rect x="185.0" y="280" width="530" height="46" rx="9" fill="#e0f2fe" stroke="#0284c7"/><text x="450" y="309" fill="#0f172a">parseMultiplication: *, /</text><path d="M450 326 L450 355" stroke="#64748b" stroke-width="2" fill="none"/><rect x="185.0" y="355" width="530" height="46" rx="9" fill="#e0f2fe" stroke="#0284c7"/><text x="450" y="384" fill="#0f172a">parsePrimary: скобки или операнд</text><path d="M450 401 L450 430" stroke="#64748b" stroke-width="2" fill="none"/><rect x="185.0" y="430" width="530" height="46" rx="9" fill="#e0f2fe" stroke="#0284c7"/><text x="450" y="459" fill="#0f172a">parseOperand: число, строка, имя</text><text x="450" y="515" font-size="16">Скобки запускают parseEquality для вложенного выражения.</text></g></svg>